<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>퀴즈 진행 (교사용)</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  :root{ --bg:#0f1226; --card:#1b1f3b; --accent:#6c5ce7; --accent2:#00cec9; --text:#f5f6fa; --muted:#a4a8c3; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background:radial-gradient(circle at 70% 10%,#25275a,#0f1226 70%);color:var(--text);min-height:100vh;padding:24px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:26px;margin-bottom:16px}
  .btn{
    padding:14px 28px;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transition:transform .1s;
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#2a2f55}
  .hidden{display:none}

  /* 로비 */
  .lobby{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:start;background:var(--card);border-radius:24px;padding:32px}
  .qrbox{text-align:center}
  #qrcode{background:#fff;padding:16px;border-radius:16px;display:inline-block}
  .pin{font-size:56px;font-weight:900;letter-spacing:6px;color:var(--accent2);margin:12px 0}
  .joinurl{color:var(--muted);font-size:15px;word-break:break-all;margin-top:8px}
  .players{}
  .players h2{font-size:20px;margin-bottom:12px}
  .count{color:var(--accent2);font-weight:800}
  .plist{display:flex;flex-wrap:wrap;gap:8px;max-height:340px;overflow:auto}
  .chip{background:#2a2f55;padding:8px 16px;border-radius:999px;font-weight:600}

  /* 문제 화면 */
  .qcard{background:var(--card);border-radius:24px;padding:32px}
  .qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin-bottom:16px}
  .timer{font-size:32px;font-weight:900;color:var(--accent2)}
  .qtext{font-size:32px;font-weight:800;line-height:1.4;margin:16px 0 28px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .opt{padding:24px;border-radius:16px;font-size:22px;font-weight:700;color:#fff}
  .opt:nth-child(1){background:#e17055}
  .opt:nth-child(2){background:#0984e3}
  .opt:nth-child(3){background:#00b894}
  .opt:nth-child(4){background:#fdcb6e;color:#2d3436}
  .short{font-size:24px;color:var(--muted);padding:24px;background:#12152e;border-radius:16px;text-align:center}
  .progress{margin-top:20px;font-size:20px;text-align:center;color:var(--muted)}
  .progress b{color:var(--accent2)}
  .controls{display:flex;gap:12px;margin-top:24px;justify-content:center}

  /* 순위판 */
  .board{background:var(--card);border-radius:24px;padding:32px}
  .board h2{font-size:24px;margin-bottom:8px}
  .answer{color:var(--accent2);font-weight:700;margin-bottom:20px}
  .row{
    display:flex;align-items:center;gap:16px;background:#12152e;border-radius:14px;
    padding:16px 20px;margin-bottom:10px;font-size:20px;transition:all .4s;
  }
  .row .r{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;background:#2a2f55}
  .row.top1 .r{background:#ffd700;color:#2d3436}
  .row.top2 .r{background:#c0c0c0;color:#2d3436}
  .row.top3 .r{background:#cd7f32}
  .row .nm{flex:1;font-weight:700}
  .row .sc{font-weight:900;color:var(--accent2)}
  .row .gain{color:#55efc4;font-size:15px;margin-left:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🧑‍🏫 퀴즈 진행 (교사용)</h1>

  <!-- 로비 -->
  <div id="lobby" class="lobby">
    <div class="qrbox">
      <div id="qrcode"></div>
      <div class="pin" id="pin">----</div>
      <div class="joinurl" id="joinurl"></div>
    </div>
    <div class="players">
      <h2>참가자 <span class="count" id="pcount">0</span>명</h2>
      <div class="plist" id="plist"></div>
      <button class="btn" id="startBtn" style="margin-top:24px">▶ 게임 시작</button>
    </div>
  </div>

  <!-- 문제 -->
  <div id="question" class="qcard hidden">
    <div class="qhead">
      <span id="qnum"></span>
      <span class="timer" id="timer"></span>
    </div>
    <div class="qtext" id="qtext"></div>
    <div class="opts" id="opts"></div>
    <div class="short hidden" id="short">✍️ 주관식 문제 — 학생들이 답을 입력 중…</div>
    <div class="progress">응답 <b id="answered">0</b> / <span id="ptotal">0</span>명</div>
    <div class="controls">
      <button class="btn ghost" id="revealBtn">결과 보기</button>
    </div>
  </div>

  <!-- 순위판 -->
  <div id="board" class="board hidden">
    <h2 id="boardTitle">🏆 순위</h2>
    <div class="answer" id="answerLine"></div>
    <div id="rows"></div>
    <div class="controls">
      <button class="btn" id="nextBtn">다음 문제 ▶</button>
    </div>
  </div>
</div>

<script>
// ====== 여기에서 문제를 편집하세요 ======
const QUIZ = {
 title: "의학용어 퀴즈",
  questions: [
    {
      type: "mc",
      q: "다음 중 '색상'을 나타내는 어근과 실제 임상 용어의 연결이 올바르지 않은 것은?",
      options: [
        "melan/o (검은) — melanoma (흑색종)",
        "leuk/o (하얀) — leukemia (백혈병)",
        "cyan/o (붉은) — cyanosis (청색증)",
        "erythr/o (붉은)"
      ],
      answer: 2,
      time: 30
    },
    {
      type: "short",
      q: "'위(stomach)'를 뜻하는 어근 gastr/o와 '염증(inflammation)'을 뜻하는 접미사 -itis를 조립하여 완성되는 의학용어를 쓰시오.",
      answer: ["gastritis"],
      time: 30
    },
    {
      type: "mc",
      q: "의학용어 pericardium에서 사용된 접두사 peri-의 의미로 올바른 것은?",
      options: ["안에 (endo-)", "위에 (epi-)", "아래에 (sub-)", "주위에 (around)"],
      answer: 3,
      time: 25
    },
    {
      type: "short",
      q: "어근 'cardi/o'가 의미하는 신체 부위는?",
      answer: ["심장", "heart"],
      time: 25
    },
    {
      type: "mc",
      q: "어근과 접미사가 결합할 때, 규칙에 따라 연결모음 'o'가 생략되어야 하는 결합 방식은?",
      options: [
        "gastr/o + -megaly",
        "cardi/o + -pathy",
        "gastr/o + -itis",
        "oste/o + -malacia"
      ],
      answer: 2,
      time: 30
    },
    {
      type: "mc",
      q: "'배뇨곤란'을 뜻하는 dysuria에서 접두사 dys-가 나타내는 의미로 가장 적절한 것은?",
      options: [
        "없는, 무(a-/an-)",
        "나쁜(mal-)",
        "곤란, 병적(painful, difficult)",
        "초과, 과다(hyper-)"
      ],
      answer: 2,
      time: 25
    },
    {
      type: "mc",
      q: "임상 현장에서 투약 처방 시 자주 사용되는 약어 중, '필요시(Pro Re Nata)'를 뜻하며 통증 완화제 등에 주로 결합하는 약어는?",
      options: ["NPO", "PRN", "stat", "BID"],
      answer: 1,
      time: 25
    },
    {
      type: "short",
      q: "어근 melan/o와 접미사 -oma(종양)가 결합하여 만들어진 질환명은?",
      answer: ["melanoma"],
      time: 25
    },
    {
      type: "mc",
      q: "'삼킴곤란(aphagia)'에서 사용된 접미사 -phagia가 가진 본래의 의미는?",
      options: ["소화", "삼킴", "구토", "통증"],
      answer: 1,
      time: 25
    },
    {
      type: "mc",
      q: "정맥 주사를 뜻하는 약어 IV는 Intravenous에서 유래한다. 접두사 intra-가 가진 의미로 가장 올바른 것은?",
      options: [
        "밖의, 외부(extra-)",
        "안의, 내부(within)",
        "사이의(inter-)",
        "초과, 과다(hyper-)"
      ],
      answer: 1,
      time: 25
    }
  ]
};
  
// ========================================

const socket = io();
let PIN = '';
let timerInt = null;

function show(id){
  ['lobby','question','board'].forEach(x=>document.getElementById(x).classList.toggle('hidden', x!==id));
}

// 방 생성
socket.emit('host:create', QUIZ, (res)=>{
  if(!res.ok) return;
  PIN = res.pin;
  document.getElementById('pin').textContent = PIN;
  const url = location.origin + '/?pin=' + PIN;
  document.getElementById('joinurl').textContent = url;
  new QRCode(document.getElementById('qrcode'), { text:url, width:220, height:220 });
});

// 참가자 갱신
socket.on('host:players', (d)=>{
  document.getElementById('pcount').textContent = d.count;
  document.getElementById('plist').innerHTML = d.names.map(n=>`<span class="chip">${escapeHtml(n)}</span>`).join('');
});

document.getElementById('startBtn').onclick = ()=> socket.emit('host:next');
document.getElementById('revealBtn').onclick = ()=> socket.emit('host:reveal');
document.getElementById('nextBtn').onclick = ()=> socket.emit('host:next');

function startTimer(sec){
  clearInterval(timerInt);
  let t = sec;
  const el = document.getElementById('timer');
  el.textContent = t+'s';
  timerInt = setInterval(()=>{ t--; el.textContent=Math.max(0,t)+'s'; if(t<=0){clearInterval(timerInt); socket.emit('host:reveal');} },1000);
}

socket.on('host:question', (q)=>{
  show('question');
  document.getElementById('qnum').textContent = `문제 ${q.index+1} / ${q.total}`;
  document.getElementById('qtext').textContent = q.question;
  const opts=document.getElementById('opts');
  const short=document.getElementById('short');
  opts.innerHTML='';
  if(q.type==='mc'){
    short.classList.add('hidden'); opts.classList.remove('hidden');
    q.options.forEach(o=>{ const d=document.createElement('div'); d.className='opt'; d.textContent=o; opts.appendChild(d); });
  } else {
    opts.classList.add('hidden'); short.classList.remove('hidden');
  }
  document.getElementById('answered').textContent='0';
  document.getElementById('ptotal').textContent=document.getElementById('pcount').textContent;
  startTimer(q.time);
});

socket.on('host:progress', (d)=>{
  document.getElementById('answered').textContent = d.answered;
  document.getElementById('ptotal').textContent = d.total;
});

socket.on('host:reveal', (d)=>{
  clearInterval(timerInt);
  show('board');
  document.getElementById('boardTitle').textContent='🏆 현재 순위';
  const ans = d.correctAnswer;
  document.getElementById('answerLine').textContent = '정답: ' + (typeof ans==='number' ? '보기 '+(ans+1)+'번' : ans);
  renderBoard(d.leaderboard);
});

socket.on('game:ended', (d)=>{
  clearInterval(timerInt);
  show('board');
  document.getElementById('boardTitle').textContent='🎉 최종 결과';
  document.getElementById('answerLine').textContent='';
  document.getElementById('nextBtn').classList.add('hidden');
  renderBoard(d.leaderboard);
});

function renderBoard(list){
  const rows=document.getElementById('rows');
  rows.innerHTML = list.map((p,i)=>{
    const cls = i===0?'top1':i===1?'top2':i===2?'top3':'';
    const gain = p.lastGain>0 ? `<span class="gain">+${p.lastGain}</span>` : '';
    return `<div class="row ${cls}">
      <div class="r">${i+1}</div>
      <div class="nm">${escapeHtml(p.name)}</div>
      <div class="sc">${p.score.toLocaleString()}점 ${gain}</div>
    </div>`;
  }).join('') || '<div class="progress">아직 참가자가 없습니다</div>';
}

function escapeHtml(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
</script>
</body>
</html>
