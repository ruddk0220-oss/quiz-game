<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>퀴즈 진행 (교사용)</title>
<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  :root{ --bg:#0f1226; --card:#1b1f3b; --accent:#6c5ce7; --accent2:#00cec9; --text:#f5f6fa; --muted:#a4a8c3; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Malgun Gothic',sans-serif;
    background:radial-gradient(circle at 70% 10%,#25275a,#0f1226 70%);color:var(--text);min-height:100vh;padding:24px;
  }
  .wrap{max-width:1100px;margin:0 auto}
  h1{font-size:26px;margin-bottom:16px}
  .btn{
    padding:14px 28px;border:none;border-radius:12px;font-size:17px;font-weight:700;cursor:pointer;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;transition:transform .1s;
  }
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:#2a2f55}
  .hidden{display:none}

  /* 로비 */
  .lobby{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:start;background:var(--card);border-radius:24px;padding:32px}
  .qrbox{text-align:center}
  #qrcode{background:#fff;padding:16px;border-radius:16px;display:inline-block}
  .pin{font-size:56px;font-weight:900;letter-spacing:6px;color:var(--accent2);margin:12px 0}
  .joinurl{color:var(--muted);font-size:15px;word-break:break-all;margin-top:8px}
  .players{}
  .players h2{font-size:20px;margin-bottom:12px}
  .count{color:var(--accent2);font-weight:800}
  .plist{display:flex;flex-wrap:wrap;gap:8px;max-height:340px;overflow:auto}
  .chip{background:#2a2f55;padding:8px 16px;border-radius:999px;font-weight:600}

  /* 문제 화면 */
  .qcard{background:var(--card);border-radius:24px;padding:32px}
  .qhead{display:flex;justify-content:space-between;align-items:center;color:var(--muted);margin-bottom:16px}
  .timer{font-size:32px;font-weight:900;color:var(--accent2)}
  .qtext{font-size:32px;font-weight:800;line-height:1.4;margin:16px 0 28px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .opt{padding:24px;border-radius:16px;font-size:22px;font-weight:700;color:#fff}
  .opt:nth-child(1){background:#e17055}
  .opt:nth-child(2){background:#0984e3}
  .opt:nth-child(3){background:#00b894}
  .opt:nth-child(4){background:#fdcb6e;color:#2d3436}
  .short{font-size:24px;color:var(--muted);padding:24px;background:#12152e;border-radius:16px;text-align:center}
  .progress{margin-top:20px;font-size:20px;text-align:center;color:var(--muted)}
  .progress b{color:var(--accent2)}
  .controls{display:flex;gap:12px;margin-top:24px;justify-content:center}

  /* 순위판 */
